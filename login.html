<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-96 space-y-4">
    <h2 class="text-xl font-bold text-center text-gray-800">Login Admin</h2>
    <div class="space-y-3">
      <input type="text" id="username" placeholder="Username" class="w-full border p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      <input type="password" id="password" placeholder="Password" class="w-full border p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded text-sm font-bold hover:bg-indigo-700 transition">Masuk</button>
    </div>
  </div>

  <script>
    function handleLogin() {
      // Sesuaikan username & password admin Anda di sini
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      if (user === "admin" && pass === "12345") {
        localStorage.setItem("admin_logged_in", "true");
        window.location.href = "admin.html";
      } else {
        alert("Username atau Password salah!");
      }
    }
  </script>
</body>
</html>

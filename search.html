<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Cari Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-24">

  <!-- HEADER UTAMA -->
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="font-bold text-lg md:text-xl flex items-center gap-2">
      <i class="fa-solid fa-magnifying-glass text-sky-400"></i>
      <span>Sistem Cari Data</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">
        <i class="fa-solid fa-circle text-emerald-500 text-[8px] mr-1"></i> Mode Pencarian
      </span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto my-6 px-4 space-y-6">

    <!-- FORM PENCARIAN -->
    <div class="bg-white p-5 md:p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 border-b pb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-search text-sky-600"></i> Pencarian Terpusat
          </h2>
          <p class="text-xs text-slate-500">Cari berdasarkan Nama, CID, ODP, SN, PSN, atau POP</p>
        </div>
        <button onclick="loadSearchData()" id="btn-refresh" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition shadow-sm">
          <i class="fa-solid fa-arrows-rotate" id="icon-refresh"></i> Refresh Data
        </button>
      </div>

      <div class="relative">
        <input type="text" id="input-search" onkeyup="filterSearchData()" placeholder="Ketik parameter yang ingin dicari..." class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500 font-medium bg-slate-50 focus:bg-white transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
      </div>
    </div>

    <!-- HASIL TABEL PENCARIAN -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="p-4 bg-slate-800 text-white flex justify-between items-center text-sm font-semibold">
        <span><i class="fa-solid fa-list-check mr-2"></i>Hasil Pencarian</span>
        <span id="search-count" class="bg-sky-500 text-white px-3 py-0.5 rounded-full text-xs font-bold">0 Data</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 uppercase font-bold">
              <th class="p-3">Waktu</th>
              <th class="p-3">POP</th>
              <th class="p-3">ODP</th>
              <th class="p-3">CID Lama</th>
              <th class="p-3">Nama Lama</th>
              <th class="p-3">SN Unit</th>
              <th class="p-3">P-SN</th>
              <th class="p-3">Foto Rumah</th>
              <th class="p-3">Foto Alat</th>
              <th class="p-3">Lokasi</th>
              <th class="p-3">Ket</th>
            </tr>
          </thead>
          <tbody id="search-table-body" class="divide-y divide-slate-200 text-slate-700">
            <tr>
              <td colspan="11" class="p-8 text-center text-slate-400 font-medium">
                Mengambil data dari server...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ================= BOTTOM NAVIGATION BAR (SESUAI HALAMAN ADMIN) ================= -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 shadow-2xl z-50">
    <div class="max-w-md mx-auto flex justify-around items-center h-16 px-2">
      
      <!-- 1. Sistem Cari (Active) -->
      <a href="search.html" class="flex flex-col items-center justify-center w-full h-full text-sky-400 transition">
        <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Sistem Cari</span>
      </a>

      <!-- 2. Info Perangkat (Kembali ke admin.html) -->
      <a href="admin.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-sky-400 transition">
        <i class="fa-solid fa-microchip text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Info Perangkat</span>
      </a>

      <!-- 3. Sistem Lapangan (Direct Link ke index.html) -->
      <a href="index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-amber-400 transition">
        <div class="bg-amber-500 text-slate-900 w-8 h-8 rounded-full flex items-center justify-center shadow-lg -mt-3 border-2 border-slate-900">
          <i class="fa-solid fa-satellite-dish text-sm"></i>
        </div>
        <span class="text-[10px] font-medium mt-0.5">Lapangan</span>
      </a>

      <!-- 4. Panel Kontrol (Kembali ke admin.html) -->
      <a href="admin.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-sky-400 transition">
        <i class="fa-solid fa-sliders text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Panel</span>
      </a>

      <!-- 5. Profil (Kembali ke admin.html) -->
      <a href="admin.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-sky-400 transition">
        <i class="fa-solid fa-user text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Profil</span>
      </a>

    </div>
  </nav>

  <!-- JAVASCRIPT SISTEM PENCARIAN -->
  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
    let searchDataStore = [];

    async function loadSearchData() {
      const iconRefresh = document.getElementById('icon-refresh');
      const tbody = document.getElementById('search-table-body');
      
      if(iconRefresh) iconRefresh.classList.add('fa-spin');
      tbody.innerHTML = `
        <tr>
          <td colspan="11" class="p-8 text-center text-slate-500 font-medium">
            <i class="fa-solid fa-spinner fa-spin text-sky-600 text-xl block mb-2"></i>
            Memuat data terbaru...
          </td>
        </tr>
      `;

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDataAdmin`);
        const result = await response.json();

        if (result.status === "success") {
          searchDataStore = result.data.reverse();
          renderSearchTable(searchDataStore);
        } else {
          tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-red-500 font-medium">Gagal mengambil data.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-red-500 font-medium">Koneksi terputus atau URL Apps Script belum sesuai.</td></tr>`;
      } finally {
        if(iconRefresh) iconRefresh.classList.remove('fa-spin');
      }
    }

    function renderSearchTable(dataList) {
      const tbody = document.getElementById('search-table-body');
      document.getElementById('search-count').innerText = `${dataList.length} Data`;

      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-slate-400 font-medium">Data tidak ditemukan.</td></tr>`;
        return;
      }

      let html = '';
      dataList.forEach(row => {
        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-mono text-[11px] whitespace-nowrap">${row.timestamp}</td>
            <td class="p-3 font-semibold text-slate-800">${row.pop}</td>
            <td class="p-3 font-semibold text-sky-600">${row.odp}</td>
            <td class="p-3">${row.cid_lama}</td>
            <td class="p-3 font-medium text-slate-800">${row.nama_lama}</td>
            <td class="p-3 font-mono">${row.sn}</td>
            <td class="p-3 font-mono">${row.psn}</td>
            <td class="p-3">
              ${row.foto_rumah_url && row.foto_rumah_url.includes('http') ? 
                `<a href="${row.foto_rumah_url}" target="_blank" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded font-medium text-[11px] flex items-center gap-1 w-fit"><i class="fa-solid fa-image"></i> Lihat</a>` 
                : `<span class="text-slate-400">-</span>`}
            </td>
            <td class="p-3">
              ${row.foto_alat_url && row.foto_alat_url.includes('http') ? 
                `<a href="${row.foto_alat_url}" target="_blank" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2 py-1 rounded font-medium text-[11px] flex items-center gap-1 w-fit"><i class="fa-solid fa-image"></i> Lihat</a>` 
                : `<span class="text-slate-400">-</span>`}
            </td>
            <td class="p-3">
              ${row.link_maps ? 
                `<a href="${row.link_maps}" target="_blank" class="bg-sky-50 text-sky-600 hover:bg-sky-100 px-2 py-1 rounded font-medium text-[11px] flex items-center gap-1 w-fit"><i class="fa-solid fa-map-pin"></i> Maps</a>` 
                : `<span class="text-slate-400">-</span>`}
            </td>
            <td class="p-3 text-slate-500 max-w-xs truncate" title="${row.keterangan}">${row.keterangan || '-'}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function filterSearchData() {
      const keyword = document.getElementById('input-search').value.toLowerCase();
      const filtered = searchDataStore.filter(item => {
        return (
          item.nama_lama.toLowerCase().includes(keyword) ||
          item.cid_lama.toLowerCase().includes(keyword) ||
          item.odp.toLowerCase().includes(keyword) ||
          item.sn.toLowerCase().includes(keyword) ||
          item.psn.toLowerCase().includes(keyword) ||
          item.pop.toLowerCase().includes(keyword) ||
          item.keterangan.toLowerCase().includes(keyword)
        );
      });
      renderSearchTable(filtered);
    }

    window.onload = function() {
      loadSearchData();
    };
  </script>
</body>
</html>

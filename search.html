<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Rekap Data Admin - Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
    
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #334155; }
    .header-title { font-size: 22px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .nav-buttons { display: flex; gap: 10px; }
    .btn-nav { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; color: #fff; background: #334155; transition: 0.2s; }
    .btn-nav:hover { background: #475569; }
    .btn-nav.active { background: #2563eb; }

    .panel-card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px solid #334155; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .filter-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
    .form-control { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    .form-control:focus { border-color: #2563eb; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .total-info { font-size: 14px; color: #cbd5e1; }
    .btn-group { display: flex; gap: 10px; }
    .btn-action { padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #fff; }
    .btn-wa { background: #10b981; } .btn-wa:hover { background: #059669; }
    .btn-refresh { background: #2563eb; } .btn-refresh:hover { background: #1d4ed8; }

    /* Table Styling */
    .table-container { background: #1e293b; border-radius: 12px; overflow-x: auto; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #0f172a; color: #94a3b8; padding: 14px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; border-bottom: 1px solid #334155; }
    td { padding: 14px 16px; border-bottom: 1px solid #334155; color: #e2e8f0; vertical-align: top; }
    tr:hover { background: rgba(51, 65, 85, 0.5); }

    .badge-sheet { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #334155; color: #38bdf8; }
    .text-cid { font-weight: 700; color: #ffffff; }
    .text-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .sn-box { font-family: monospace; white-space: pre-wrap; word-break: break-all; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; color: #cbd5e1; }
    .sn-box a { color: #38bdf8; text-decoration: none; }
    .sn-box a:hover { text-decoration: underline; }

    .btn-icon-wa { width: 32px; height: 32px; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none; border: none; cursor: pointer; }
    .btn-icon-wa:hover { background: #059669; }
  </style>
</head>
<body>

  <!-- Pengaman Sesi Admin -->
  <script>
    const sessionData = localStorage.getItem("session_user");
    if (!sessionData) {
      alert("Akses ditolak! Anda wajib login terlebih dahulu.");
      window.location.href = "login.html";
    }
  </script>

  <!-- Header Navigation -->
  <div class="header-nav">
    <div class="header-title">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Dashboard Admin</span>
    </div>
    <div class="nav-buttons">
      <a href="index.html" class="btn-nav">Form Lapangan</a>
      <a href="search.html" class="btn-nav active">Dashboard Admin</a>
      <button onclick="logout()" class="btn-nav" style="background:#ef4444;"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </div>

  <!-- Panel Filter -->
  <div class="panel-card">
    <h3 style="margin-bottom: 16px; font-size: 16px; color: #fff;">Panel Rekap Data Admin</h3>
    
    <div class="filter-grid">
      <div class="filter-group">
        <label>Pilih Sumber Sheet</label>
        <select id="filterSheet" class="form-control" onchange="applyFilter()">
          <option value="ALL">Semua Sheet</option>
          <option value="target">target</option>
          <option value="Full Data">Full Data</option>
          <option value="Baris 1">Baris 1</option>
          <option value="sudah diambil">sudah diambil</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Kriteria Cari</label>
        <select id="filterKriteria" class="form-control" onchange="applyFilter()">
          <option value="ALL">Semua Kriteria</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Cari Berdasarkan Tanggal</label>
        <input type="date" id="filterTanggal" class="form-control" onchange="applyFilter()">
      </div>

      <div class="filter-group">
        <label>Kata Kunci / Scan</label>
        <input type="text" id="filterKeyword" class="form-control" placeholder="Ketik CID, Nama, SN, ODP..." oninput="applyFilter()">
      </div>
    </div>

    <div class="action-bar">
      <div class="total-info">
        Total Hasil: <strong id="totalData">0</strong> Data
        <a href="javascript:void(0)" onclick="resetFilter()" style="color:#38bdf8; margin-left:10px; text-decoration:none; font-size:12px;">Reset Filter</a>
      </div>
      <div class="btn-group">
        <button class="btn-action btn-wa" onclick="kirimGabunganWA()"><i class="fa-brands fa-whatsapp"></i> Kirim Gabungan (WA)</button>
        <button class="btn-action btn-refresh" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
    </div>
  </div>

  <!-- Tabel Data -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 40px;"><input type="checkbox" id="checkAll" onclick="toggleSelectAll(this)"></th>
          <th>Sumber Sheet</th>
          <th>Waktu / Tanggal</th>
          <th>ODP</th>
          <th>POP</th>
          <th>CID / Nama</th>
          <th>SN Unit / Data Gabungan</th>
          <th style="width: 60px; text-align: center;">Aksi WA</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="8" style="text-align: center; padding: 40px; color: #94a3b8;">Memuat data dari Google Sheets...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec"; // Ganti dengan URL /exec Apps Script Anda
    let globalData = [];

    document.addEventListener("DOMContentLoaded", function() {
      loadData();
    });

    function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 40px; color: #94a3b8;"><i class="fa-solid fa-circle-notch fa-spin"></i> Memuat data...</td></tr>`;

      fetch(`${SCRIPT_URL}?action=getDataAdmin`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            globalData = res.data || [];
            populateKriteriaDropdown();
            applyFilter();
          } else {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #ef4444;">Gagal memuat data: ${res.message}</td></tr>`;
          }
        })
        .catch(err => {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #ef4444;">Gagal terhubung ke Google Sheets!</td></tr>`;
        });
    }

    function populateKriteriaDropdown() {
      const selectKriteria = document.getElementById("filterKriteria");
      const kriteriaSet = new Set();

      globalData.forEach(item => {
        if (item.kolom_i && item.kolom_i.trim() !== "") {
          kriteriaSet.add(item.kolom_i.trim());
        }
      });

      selectKriteria.innerHTML = `<option value="ALL">Semua Kriteria</option>`;
      kriteriaSet.forEach(k => {
        selectKriteria.innerHTML += `<option value="${k}">${k}</option>`;
      });
    }

    function applyFilter() {
      const sheetVal = document.getElementById("filterSheet").value;
      const kriteriaVal = document.getElementById("filterKriteria").value;
      const tanggalVal = document.getElementById("filterTanggal").value;
      const keywordVal = document.getElementById("filterKeyword").value.toLowerCase().trim();

      const filtered = globalData.filter(item => {
        // Filter Sheet
        if (sheetVal !== "ALL" && item.sumber_sheet !== sheetVal) return false;
        
        // Filter Kriteria
        if (kriteriaVal !== "ALL" && item.kolom_i !== kriteriaVal) return false;

        // Filter Tanggal
        if (tanggalVal !== "") {
          if (!item.timestamp || !item.timestamp.startsWith(tanggalVal)) return false;
        }

        // Filter Keyword
        if (keywordVal !== "") {
          const matchCid = (item.cid_lama || "").toLowerCase().includes(keywordVal);
          const matchNama = (item.nama_lama || "").toLowerCase().includes(keywordVal);
          const matchOdp = (item.odp || "").toLowerCase().includes(keywordVal);
          const matchPop = (item.pop || "").toLowerCase().includes(keywordVal);
          const matchSn = (item.sn || "").toLowerCase().includes(keywordVal);
          if (!matchCid && !matchNama && !matchOdp && !matchPop && !matchSn) return false;
        }

        return true;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      document.getElementById("totalData").innerText = data.length;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 40px; color: #94a3b8;">Tidak ada data yang cocok dengan filter.</td></tr>`;
        return;
      }

      let html = "";
      data.forEach((item, idx) => {
        // Format Tautan Otomatis pada Link Sherlock/Maps
        let snFormatted = item.sn || "-";
        if (snFormatted.includes("https://")) {
          snFormatted = snFormatted.replace(/(https:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        }

        html += `
          <tr>
            <td><input type="checkbox" class="row-check" value="${idx}"></td>
            <td><span class="badge-sheet">${item.sumber_sheet || '-'}</span></td>
            <td>${item.timestamp || '-'}</td>
            <td style="color:#38bdf8; font-weight:600;">${item.odp || '-'}</td>
            <td>${item.pop || '-'}</td>
            <td>
              <div class="text-cid">${item.nama_lama || '-'}</div>
              <div class="text-sub">CID: ${item.cid_lama || '-'}</div>
            </td>
            <td>
              <div class="sn-box">${snFormatted}</div>
            </td>
            <td style="text-align: center;">
              <button onclick="kirimBarisWA('${encodeURIComponent(JSON.stringify(item))}')" class="btn-icon-wa" title="Kirim WA">
                <i class="fa-brands fa-whatsapp"></i>
              </button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function resetFilter() {
      document.getElementById("filterSheet").value = "ALL";
      document.getElementById("filterKriteria").value = "ALL";
      document.getElementById("filterTanggal").value = "";
      document.getElementById("filterKeyword").value = "";
      applyFilter();
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll(".row-check");
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    function kirimBarisWA(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      let pesan = `*DATA RECORD ADMIN*\n\n`;
      pesan += `*Sheet:* ${item.sumber_sheet}\n`;
      pesan += `*Nama:* ${item.nama_lama}\n`;
      pesan += `*CID:* ${item.cid_lama}\n`;
      pesan += `*ODP:* ${item.odp}\n`;
      pesan += `*POP:* ${item.pop}\n`;
      pesan += `*Data SN / Info:* ${item.sn}\n`;

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function kirimGabunganWA() {
      const selected = document.querySelectorAll(".row-check:checked");
      if (selected.length === 0) {
        alert("Pilih minimal satu data yang ingin dikirim!");
        return;
      }

      let pesan = `*REKAP DATA PILIHAN ADMIN*\n----------------------------------\n\n`;
      selected.forEach((cb, i) => {
        const itemIndex = cb.value;
        const item = globalData[itemIndex];
        if (item) {
          pesan += `*${i + 1}. ${item.nama_lama} (CID: ${item.cid_lama})*\n`;
          pesan += `ODP: ${item.odp} | POP: ${item.pop}\n`;
          pesan += `Info: ${item.sn}\n\n`;
        }
      });

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function logout() {
      localStorage.removeItem("session_user");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>

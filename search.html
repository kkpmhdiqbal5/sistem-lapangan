<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Cari - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR DENGAN KEDUA TOMBOL NAVIGASI -->
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
      <i class="fa-solid fa-magnifying-glass text-emerald-600"></i> Sistem Cari Data
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-sky-600 text-white hover:bg-sky-700 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-satellite-dish"></i> Sistem Lapangan
      </a>
      <a href="admin.html" class="bg-indigo-600 text-white hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-gauge"></i> Dashboard Admin
      </a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto my-8 px-4 space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-md border space-y-4">
      <h2 class="text-base font-bold text-gray-800">Pencarian Data Perangkat / Pelanggan</h2>
      <div class="flex gap-2">
        <input type="text" id="search-input" placeholder="Ketik CID, Nama, ODP, SN, atau P-SN..." class="w-full border border-gray-300 p-3 rounded-md text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        <button onclick="performSearch()" class="bg-emerald-600 text-white px-6 py-3 rounded-md font-medium text-sm hover:bg-emerald-700 transition">
          <i class="fa-solid fa-search"></i> Cari
        </button>
      </div>
      <div id="search-results" class="text-sm text-gray-500 pt-4 border-t">
        Masukkan kata kunci untuk mencari data...
      </div>
    </div>
  </div>

  <script>
    // Cek Sesi Login Admin
    if (localStorage.getItem("admin_logged_in") !== "true") {
      window.location.href = "login.html";
    }

    function performSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      const resultsDiv = document.getElementById('search-results');
      if (!keyword) {
        resultsDiv.innerHTML = "Mohon masukkan kata kunci pencarian.";
        return;
      }
      resultsDiv.innerHTML = `Mencari data untuk keyword: <b>${keyword}</b>... (Fitur pencarian terhubung ke database lembar kerja)`;
    }
  </script>
</body>
</html>

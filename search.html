<!-- Tabel Data Lengkap -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 30px;"><input type="checkbox" id="checkAll" onclick="toggleSelectAll(this)"></th>
          <th>SHEET</th>
          <th>WAKTU</th>
          <th>ODP</th>
          <th>POP</th>
          <th>CID / NAMA</th>
          <th>PAKET</th>
          <th>NO HP</th>
          <th>SHERLOCK</th>
          <th>SALES</th>
          <th>KET / KENDALA</th>
          <th>FOTO RUMAH</th>
          <th>FOTO ALAT</th>
          <th>SN</th>
          <th>P-SN</th>
          <th style="text-align: center;">AKSI</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="16" style="text-align: center; padding: 40px; color: #94a3b8;">Memuat data dari Google Sheets...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
    let globalData = [];

    document.addEventListener("DOMContentLoaded", function() {
      loadData();
    });

    function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="16" style="text-align: center; padding: 40px; color: #94a3b8;"><i class="fa-solid fa-circle-notch fa-spin"></i> Memuat data...</td></tr>`;

      fetch(`${SCRIPT_URL}?action=getDataAdmin`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            globalData = res.data || [];
            populateKriteriaDropdown();
            applyFilter();
          } else {
            tbody.innerHTML = `<tr><td colspan="16" style="text-align: center; color: #ef4444;">Gagal memuat data: ${res.message}</td></tr>`;
          }
        })
        .catch(err => {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="16" style="text-align: center; color: #ef4444;">Gagal terhubung ke Google Sheets!</td></tr>`;
        });
    }

    function populateKriteriaDropdown() {
      const selectKriteria = document.getElementById("filterKriteria");
      const kriteriaSet = new Set();

      globalData.forEach(item => {
        if (item.kolom_i && item.kolom_i.trim() !== "") {
          kriteriaSet.add(item.kolom_i.trim());
        }
      });

      selectKriteria.innerHTML = `<option value="ALL">Semua Kriteria</option>`;
      kriteriaSet.forEach(k => {
        selectKriteria.innerHTML += `<option value="${k}">${k}</option>`;
      });
    }

    function applyFilter() {
      const sheetVal = document.getElementById("filterSheet").value;
      const kriteriaVal = document.getElementById("filterKriteria").value;
      const tanggalVal = document.getElementById("filterTanggal").value;
      const keywordVal = document.getElementById("filterKeyword").value.toLowerCase().trim();

      const filtered = globalData.filter(item => {
        if (sheetVal !== "ALL" && item.sumber_sheet !== sheetVal) return false;
        if (kriteriaVal !== "ALL" && item.kolom_i !== kriteriaVal) return false;
        if (tanggalVal !== "" && (!item.timestamp || !item.timestamp.startsWith(tanggalVal))) return false;

        if (keywordVal !== "") {
          const matchCid = (item.cid_lama || "").toLowerCase().includes(keywordVal);
          const matchNama = (item.nama_lama || "").toLowerCase().includes(keywordVal);
          const matchOdp = (item.odp || "").toLowerCase().includes(keywordVal);
          const matchPop = (item.pop || "").toLowerCase().includes(keywordVal);
          const matchSn = (item.sn || "").toLowerCase().includes(keywordVal);
          if (!matchCid && !matchNama && !matchOdp && !matchPop && !matchSn) return false;
        }

        return true;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      document.getElementById("totalData").innerText = data.length;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="16" style="text-align: center; padding: 40px; color: #94a3b8;">Tidak ada data yang cocok dengan filter.</td></tr>`;
        return;
      }

      let html = "";
      data.forEach((item, idx) => {
        // Tautan Aktif Sherlock
        let sherlockHtml = item.sherlock ? (item.sherlock.includes("http") ? `<a href="${item.sherlock}" target="_blank">Buka Maps</a>` : item.sherlock) : "-";
        
        // Tautan Aktif Foto
        let fotoRumahHtml = item.foto_rumah_url ? `<a href="${item.foto_rumah_url}" target="_blank">Foto Rumah</a>` : "-";
        let fotoAlatHtml = item.foto_alat_url ? `<a href="${item.foto_alat_url}" target="_blank">Foto Alat</a>` : "-";

        html += `
          <tr>
            <td><input type="checkbox" class="row-check" value="${idx}"></td>
            <td><span class="badge-sheet">${item.sumber_sheet || '-'}</span></td>
            <td style="white-space: nowrap;">${item.timestamp || '-'}</td>
            <td style="color:#38bdf8; font-weight:600;">${item.odp || '-'}</td>
            <td>${item.pop || '-'}</td>
            <td>
              <div class="text-cid">${item.nama_lama || '-'}</div>
              <div class="text-sub">CID: ${item.cid_lama || '-'}</div>
            </td>
            <td>${item.paket || '-'}</td>
            <td>${item.nohp || '-'}</td>
            <td>${sherlockHtml}</td>
            <td>${item.sales || '-'}</td>
            <td>${item.keterangan || '-'}</td>
            <td>${fotoRumahHtml}</td>
            <td>${fotoAlatHtml}</td>
            <td>${item.sn || '-'}</td>
            <td>${item.psn || '-'}</td>
            <td style="text-align: center;">
              <button onclick="kirimBarisWA('${encodeURIComponent(JSON.stringify(item))}')" class="btn-icon-wa" title="Kirim WA">
                <i class="fa-brands fa-whatsapp"></i>
              </button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function resetFilter() {
      document.getElementById("filterSheet").value = "ALL";
      document.getElementById("filterKriteria").value = "ALL";
      document.getElementById("filterTanggal").value = "";
      document.getElementById("filterKeyword").value = "";
      applyFilter();
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll(".row-check");
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    function kirimBarisWA(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      let pesan = `*DATA RECORD ADMIN*\n\n`;
      pesan += `*Sheet:* ${item.sumber_sheet}\n`;
      pesan += `*Nama:* ${item.nama_lama}\n`;
      pesan += `*CID:* ${item.cid_lama}\n`;
      if (item.paket) pesan += `*Paket:* ${item.paket}\n`;
      if (item.nohp) pesan += `*No HP:* ${item.nohp}\n`;
      if (item.odp) pesan += `*ODP:* ${item.odp}\n`;
      if (item.pop) pesan += `*POP:* ${item.pop}\n`;
      if (item.sales) pesan += `*Sales:* ${item.sales}\n`;
      if (item.keterangan) pesan += `*Ket:* ${item.keterangan}\n`;
      if (item.sn) pesan += `*SN:* ${item.sn}\n`;
      if (item.psn) pesan += `*P-SN:* ${item.psn}\n`;

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function kirimGabunganWA() {
      const selected = document.querySelectorAll(".row-check:checked");
      if (selected.length === 0) {
        alert("Pilih minimal satu data yang ingin dikirim!");
        return;
      }

      let pesan = `*REKAP DATA PILIHAN ADMIN*\n----------------------------------\n\n`;
      selected.forEach((cb, i) => {
        const itemIndex = cb.value;
        const item = globalData[itemIndex];
        if (item) {
          pesan += `*${i + 1}. ${item.nama_lama} (CID: ${item.cid_lama})*\n`;
          if (item.paket) pesan += `Paket: ${item.paket} | `;
          if (item.nohp) pesan += `HP: ${item.nohp}\n`;
          if (item.sn) pesan += `SN: ${item.sn} | `;
          if (item.psn) pesan += `P-SN: ${item.psn}\n`;
          pesan += `\n`;
        }
      });

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function logout() {
      localStorage.removeItem("session_user");
      window.location.href = "login.html";
    }
  </script>

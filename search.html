<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Rekap Data Admin - Sistem Cari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR ATAS -->
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="font-bold text-gray-800 text-base flex items-center gap-2">
      Dashboard Admin - Sistem Cari
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-white border text-gray-700 hover:bg-gray-50 px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-satellite-dish"></i> Sistem Lapangan
      </a>
      <a href="admin.html" class="bg-indigo-600 text-white hover:bg-indigo-700 px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-gauge"></i> Dashboard Admin
      </a>
      <span class="bg-slate-800 text-white px-3 py-1.5 rounded text-xs font-bold">ADMIN</span>
      <button onclick="logout()" class="text-rose-600 hover:text-rose-700 p-1 text-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </nav>

  <!-- KONTROL PANEL REKAP DATA ADMIN -->
  <div class="max-w-7xl mx-auto my-6 px-4 space-y-4">
    
    <div class="bg-white p-5 rounded-xl shadow-sm border space-y-4">
      <h2 class="font-bold text-gray-800 text-base">Panel Rekap Data & Pencarian Perangkat</h2>
      
      <!-- FILTER GRID -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
        <div>
          <label class="block font-bold text-gray-500 uppercase mb-1">PILIH SUMBER KATEGORI</label>
          <select id="filter-sheet" onchange="filterData()" class="w-full border p-2.5 rounded bg-white outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
            <option value="semua">Semua Sumber Sheet Gabungan</option>
            <option value="PERANGKAT_BELOM_DI_AMBIL">PERANGKAT BELOM DI AMBIL</option>
            <option value="SUDAH_DI_AMBIL">SUDAH DI AMBIL</option>
            <option value="INFO_PERANGKAT">INFO PERANGKAT</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-gray-500 uppercase mb-1">KRITERIA CARI</label>
          <select id="filter-criteria" onchange="filterData()" class="w-full border p-2.5 rounded bg-white outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
            <option value="all">Semua Gabungan (ODP / POP / CID / Nama)</option>
            <option value="odp">ODP</option>
            <option value="pop">POP</option>
            <option value="cid">CID</option>
            <option value="nama">Nama</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-gray-500 uppercase mb-1">KATA KUNCI</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search"></i></span>
            <input type="text" id="filter-keyword" onkeyup="filterData()" placeholder="Cari nama, CID, ODP, POP..." class="w-full border pl-9 p-2.5 rounded outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
        </div>
      </div>

      <!-- INFO HASIL & TOMBOL AKSI -->
      <div class="flex flex-wrap justify-between items-center pt-2 border-t text-xs gap-3">
        <span id="total-hasil" class="font-bold text-gray-600">Total Hasil: 0 Data</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="sendGroupWA()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded font-medium flex items-center gap-1 shadow-sm">
            <i class="fa-brands fa-whatsapp"></i> Kirim Gabungan (<span id="count-checked">0</span> WA)
          </button>
          <button onclick="sendMultipleWA()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded font-medium flex items-center gap-1 shadow-sm">
            <i class="fa-brands fa-whatsapp"></i> Kirim Sekaligus (<span id="count-checked-2">0</span>)
          </button>
          <button onclick="loadAllData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded font-medium flex items-center gap-1 border">
            <i class="fa-solid fa-rotate"></i> Refresh
          </button>
        </div>
      </div>
    </div>

    <!-- TABEL DATA -->
    <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="bg-slate-900 text-white uppercase text-[11px]">
            <th class="p-3 text-center w-10"><input type="checkbox" id="select-all" onclick="toggleSelectAll(this)"></th>
            <th class="p-3">Sumber Sheet</th>
            <th class="p-3">Waktu</th>
            <th class="p-3">ODP</th>
            <th class="p-3">POP</th>
            <th class="p-3">CID / Nama</th>
            <th class="p-3">Sherlok</th>
            <th class="p-3">SN</th>
            <th class="p-3">P-SN</th>
            <th class="p-3 text-center">Foto Rumah</th>
            <th class="p-3 text-center">Foto Alat</th>
            <th class="p-3 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-body" class="divide-y divide-gray-100 text-gray-700">
          <tr>
            <td colspan="12" class="p-8 text-center text-gray-400">Memuat data dari server...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL PREVIEW GAMBAR -->
  <div id="imageModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white p-2 rounded-lg max-w-lg w-full text-center relative" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-2 right-2 bg-rose-600 text-white w-7 h-7 rounded-full text-xs font-bold">&times;</button>
      <img id="modalImg" src="" class="max-h-[80vh] mx-auto rounded object-contain">
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
    let masterData = {};

    if (localStorage.getItem("admin_logged_in") !== "true") {
      window.location.href = "login.html";
    }

    async function loadAllData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data...</td></tr>`;
      
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllData`);
        masterData = await res.json();
        filterData();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-rose-500">Gagal memuat data dari spreadsheet.</td></tr>`;
      }
    }

    function filterData() {
      const selectedCategory = document.getElementById('filter-sheet').value;
      const criteria = document.getElementById('filter-criteria').value;
      const keyword = document.getElementById('filter-keyword').value.toLowerCase().trim();

      let targetSheets = [];
      if (selectedCategory === "semua") {
        targetSheets = Object.keys(masterData);
      } else if (selectedCategory === "PERANGKAT_BELOM_DI_AMBIL") {
        if (masterData["Full Data"]) targetSheets.push("Full Data");
        if (masterData["target"]) targetSheets.push("target");
      } else if (selectedCategory === "SUDAH_DI_AMBIL") {
        if (masterData["sudah diambil"]) targetSheets.push("sudah diambil");
      } else if (selectedCategory === "INFO_PERANGKAT") {
        if (masterData["Baris 1"]) targetSheets.push("Baris 1");
      } else {
        targetSheets = [selectedCategory];
      }

      let matchedRows = [];

      targetSheets.forEach(sheetName => {
        let rows = masterData[sheetName] || [];
        if (rows.length > 0) {
          
          let isSudahDiambil = (sheetName.toLowerCase() === "sudah diambil");
          let startIndex = isSudahDiambil ? 0 : 1;

          for (let i = startIndex; i < rows.length; i++) {
            let r = rows[i];
            if (!r || r.length === 0 || r.every(cell => cell === "")) continue;

            let waktu = '-';
            let nama = '-';
            let cid = '-';
            let odp = '-';
            let pop = '-';
            let sherlok = '-';
            let snUnit = '-';
            let psn = '-';
            let fotoRumah = '';
            let fotoAlat = '';

            if (isSudahDiambil) {
              nama = r[0] ? String(r[0]) : '-';
              cid = r[1] ? String(r[1]) : '-';
              odp = r[2] ? String(r[2]) : '-';
              snUnit = r[3] ? String(r[3]) : '-';
            } else {
              let headers = rows[0].map(h => String(h).toUpperCase().trim());

              let idxTime = headers.findIndex(h => h === "TIME" || h.includes("TIME"));
              let idxNama = headers.findIndex(h === "NAMA" || h.includes("NAMA LAMA"));
              let idxCID = headers.findIndex(h === "CID" || h.includes("CID LAMA"));
              let idxODP = headers.findIndex(h => h === "ODP");
              let idxPOP = headers.findIndex(h => h === "POP");
              
              // Memastikan pencarian kolom Sherlok mendeteksi teks 'SHERLOCK' atau 'SHERLOK'
              let idxSherlok = headers.findIndex(h => h === "SHERLOK" || h.includes("SHERLOK") || h.includes("SHERLOCK") || h.includes("MAP"));

              let idxSN = headers.findIndex(h => h.includes("SN"));
              let idxPSN = headers.findIndex(h => h.includes("P-SN"));
              let idxFotoRumah = headers.findIndex(h => h.includes("FOTO RUMAH"));
              let idxFotoAlat = headers.findIndex(h => h.includes("FOTO ALAT"));

              waktu = (idxTime !== -1 && r[idxTime]) ? String(r[idxTime]) : '-';
              nama = (idxNama !== -1 && r[idxNama]) ? String(r[idxNama]) : '-';
              cid = (idxCID !== -1 && r[idxCID]) ? String(r[idxCID]) : '-';
              odp = (idxODP !== -1 && r[idxODP]) ? String(r[idxODP]) : '-';
              pop = (idxPOP !== -1 && r[idxPOP]) ? String(r[idxPOP]) : '-';
              sherlok = (idxSherlok !== -1 && r[idxSherlok]) ? String(r[idxSherlok]) : '-';
              snUnit = (idxSN !== -1 && r[idxSN]) ? String(r[idxSN]) : '-';
              psn = (idxPSN !== -1 && r[idxPSN]) ? String(r[idxPSN]) : '-';
              fotoRumah = (idxFotoRumah !== -1 && r[idxFotoRumah]) ? String(r[idxFotoRumah]) : '';
              fotoAlat = (idxFotoAlat !== -1 && r[idxFotoAlat]) ? String(r[idxFotoAlat]) : '';
            }

            let rowText = r.join(" ").toLowerCase();
            let matchCriteria = false;

            if (keyword === "") {
              matchCriteria = true;
            } else {
              if (criteria === "odp") {
                matchCriteria = odp.toLowerCase().includes(keyword);
              } else if (criteria === "pop") {
                matchCriteria = pop.toLowerCase().includes(keyword);
              } else if (criteria === "cid") {
                matchCriteria = cid.toLowerCase().includes(keyword);
              } else if (criteria === "nama") {
                matchCriteria = nama.toLowerCase().includes(keyword);
              } else {
                matchCriteria = rowText.includes(keyword);
              }
            }

            if (matchCriteria) {
              matchedRows.push({
                sheetAsli: sheetName,
                waktu: waktu,
                odp: odp,
                pop: pop,
                cid: cid,
                nama: nama,
                sherlok: sherlok,
                snUnit: snUnit,
                psn: psn,
                fotoRumah: fotoRumah,
                fotoAlat: fotoAlat
              });
            }
          }
        }
      });

      document.getElementById('total-hasil').innerText = `Total Hasil: ${matchedRows.length} Data`;
      const tbody = document.getElementById('table-body');

      if (matchedRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400">Data tidak ditemukan pada kategori ini.</td></tr>`;
        return;
      }

      let html = "";
      matchedRows.forEach((item) => {
        let renderSherlok = item.sherlok && item.sherlok.startsWith('http') ? 
          `<a href="${item.sherlok}" target="_blank" class="text-blue-600 underline font-mono text-[11px] font-semibold"><i class="fa-solid fa-map-location-dot mr-1"></i> Buka Map</a>` : 
          `<span class="text-gray-600 font-mono text-[11px]">${item.sherlok}</span>`;

        let renderFotoRumah = item.fotoRumah && item.fotoRumah.startsWith('http') ? 
          `<img src="${item.fotoRumah}" class="w-10 h-10 object-cover rounded cursor-pointer mx-auto border shadow-sm hover:scale-110 transition" onclick="openModal('${item.fotoRumah}')">` : 
          `<span class="text-gray-400 text-[10px]">Tidak ada</span>`;

        let renderFotoAlat = item.fotoAlat && item.fotoAlat.startsWith('http') ? 
          `<img src="${item.fotoAlat}" class="w-10 h-10 object-cover rounded cursor-pointer mx-auto border shadow-sm hover:scale-110 transition" onclick="openModal('${item.fotoAlat}')">` : 
          `<span class="text-gray-400 text-[10px]">Tidak ada</span>`;

        html += `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-3 text-center"><input type="checkbox" class="row-checkbox" onchange="updateCheckedCount()"></td>
            <td class="p-3 font-semibold text-indigo-600 bg-indigo-50/50 rounded">${item.sheetAsli}</td>
            <td class="p-3 text-gray-500 whitespace-nowrap">${item.waktu}</td>
            <td class="p-3 font-medium">${item.odp}</td>
            <td class="p-3">${item.pop}</td>
            <td class="p-3"><b>${item.cid}</b> / ${item.nama}</td>
            <td class="p-3">${renderSherlok}</td>
            <td class="p-3 font-mono">${item.snUnit}</td>
            <td class="p-3 font-mono">${item.psn}</td>
            <td class="p-3 text-center">${renderFotoRumah}</td>
            <td class="p-3 text-center">${renderFotoAlat}</td>
            <td class="p-3 text-center">
              <button onclick="sendSingleWA()" class="bg-emerald-600 text-white p-1.5 rounded hover:bg-emerald-700 transition" title="Kirim WA"><i class="fa-brands fa-whatsapp"></i></button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      updateCheckedCount();
    }

    function openLink(url) {
      if(url && url.startsWith('http')) window.open(url, '_blank');
    }

    function openModal(url) {
      document.getElementById('modalImg').src = url;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.row-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateCheckedCount();
    }

    function updateCheckedCount() {
      const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
      document.getElementById('count-checked').innerText = checkedCount;
      document.getElementById('count-checked-2').innerText = checkedCount;
    }

    function sendGroupWA() {}
    function sendMultipleWA() {}
    function sendSingleWA() {}
    
    function logout() {
      localStorage.removeItem("admin_logged_in");
      window.location.href = "login.html";
    }

    window.onload = loadAllData;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Lapangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LEAFLET MAPS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- BARCODE / QR SCANNER LIBRARY -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        #map { height: 180px; width: 100%; border-radius: 1rem; z-index: 1; }
        .toast-msg {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 10px 20px; border-radius: 99px;
            transition: all 0.3s ease; z-index: 1000; font-size: 12px; font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="p-3 sm:p-6 max-w-lg mx-auto min-h-screen flex flex-col justify-between">

    <div class="space-y-3">
        <!-- HEADER APPS -->
        <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
                <span class="bg-indigo-100 text-indigo-700 text-[9px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Field Operations</span>
                <h1 class="text-lg font-black text-slate-800 mt-0.5">SISTEM LAPANGAN</h1>
            </div>
            <a href="admin.html" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-3.5 py-2 rounded-2xl text-xs flex items-center gap-2 transition shadow-md">
                <i class="fas fa-user-shield text-amber-400"></i> Admin
            </a>
        </div>

        <!-- FORM INPUT LAPANGAN -->
        <form id="formLapangan" onsubmit="handleFormSubmit(event)" class="bg-white p-4 sm:p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3.5 text-xs">
            
            <!-- MAP & KOORDINAT GPS -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="font-bold text-slate-600 uppercase text-[10px] tracking-wider"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> Lokasi GPS & Peta *</label>
                    <button type="button" onclick="getGPSLocation()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1 rounded-xl text-[10px] flex items-center gap-1 transition shadow-sm">
                        <i class="fas fa-crosshairs"></i> Deteksi GPS
                    </button>
                </div>
                
                <div id="map" class="border border-slate-200 shadow-inner"></div>
                <input type="text" id="inpKoordinat" required placeholder="Koordinat GPS (Otomatis dari Peta/GPS)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 focus:border-indigo-500">
            </div>

            <!-- ODP & POP -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-slate-600 uppercase text-[10px]">ODP *</label>
                    <input type="text" id="inpOdp" required placeholder="Nama ODP" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 mt-1 focus:border-indigo-500">
                </div>
                <div>
                    <label class="font-bold text-slate-600 uppercase text-[10px]">POP *</label>
                    <input type="text" id="inpPop" required placeholder="Nama POP" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 mt-1 focus:border-indigo-500">
                </div>
            </div>

            <!-- CID LAMA & NAMA LAMA -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-slate-600 uppercase text-[10px]">CID Lama *</label>
                    <input type="text" id="inpCidLama" required placeholder="Nomor CID" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 mt-1 focus:border-indigo-500">
                </div>
                <div>
                    <label class="font-bold text-slate-600 uppercase text-[10px]">Nama Lama *</label>
                    <input type="text" id="inpNamaLama" required placeholder="Nama Pelanggan" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 mt-1 focus:border-indigo-500">
                </div>
            </div>

            <!-- SERIAL NUMBER (SN) UNIT -->
            <div>
                <label class="font-bold text-slate-600 uppercase text-[10px]">Serial Number (SN) Unit *</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="inpSnUnit" required placeholder="SN Unit Baru" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 uppercase focus:border-indigo-500">
                    <button type="button" onclick="startScanner('inpSnUnit')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3.5 rounded-xl whitespace-nowrap transition shadow-sm">
                        <i class="fas fa-camera"></i> Scan SN
                    </button>
                </div>
            </div>

            <!-- P-SN (PATCHCORD SN) -->
            <div>
                <label class="font-bold text-slate-600 uppercase text-[10px]">P-SN (Patchcord SN) *</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="inpPSn" required placeholder="P-SN Unit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none font-semibold text-slate-700 uppercase focus:border-indigo-500">
                    <button type="button" onclick="startScanner('inpPSn')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3.5 rounded-xl whitespace-nowrap transition shadow-sm">
                        <i class="fas fa-camera"></i> Scan P-SN
                    </button>
                </div>
            </div>

            <!-- UPLOAD FOTO RUMAH & FOTO ALAT -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <div>
                    <label class="block text-center bg-slate-50 border-2 border-dashed border-slate-200 hover:border-indigo-500 rounded-2xl p-3 cursor-pointer transition">
                        <i class="fas fa-camera text-slate-400 text-xl mb-1 block"></i>
                        <span id="labelFotoRumah" class="font-extrabold text-[10px] text-slate-600">FOTO RUMAH *</span>
                        <input type="file" id="fileFotoRumah" accept="image/*" required class="hidden" onchange="updateFileLabel(this, 'labelFotoRumah')">
                    </label>
                </div>
                <div>
                    <label class="block text-center bg-slate-50 border-2 border-dashed border-slate-200 hover:border-indigo-500 rounded-2xl p-3 cursor-pointer transition">
                        <i class="fas fa-camera text-slate-400 text-xl mb-1 block"></i>
                        <span id="labelFotoAlat" class="font-extrabold text-[10px] text-slate-600">FOTO ALAT *</span>
                        <input type="file" id="fileFotoAlat" accept="image/*" required class="hidden" onchange="updateFileLabel(this, 'labelFotoAlat')">
                    </label>
                </div>
            </div>

            <!-- KETERANGAN -->
            <div>
                <label class="font-bold text-slate-600 uppercase text-[10px]">Keterangan Tambahan</label>
                <textarea id="inpKeterangan" rows="2" placeholder="Catatan opsional..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none mt-1 focus:border-indigo-500"></textarea>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-indigo-200 mt-2">
                <i class="fas fa-paper-plane mr-1"></i> Kirim Data Lapangan
            </button>
        </form>
    </div>

    <!-- MODAL SCANNER KAMERA BARCODE -->
    <div id="scannerModal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-4 w-full max-w-sm space-y-3 text-center">
            <h3 class="font-extrabold text-slate-800 text-sm">Arahkan Kamera ke Barcode</h3>
            <div id="reader" class="rounded-2xl overflow-hidden border border-slate-200"></div>
            <button type="button" onclick="stopScanner()" class="w-full bg-red-500 text-white font-bold py-2 rounded-xl text-xs">
                Tutup Kamera
            </button>
        </div>
    </div>

    <div id="toast" class="toast-msg">Notifikasi</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwESnxnJqIkgKIkEOc2UMr4uG9esO7l2wiGQ8q6uGNMLGYE6HAATTyRaXenGs5ok0HJSw/exec";
    const IMAGEKIT_PUBLIC_KEY = "public_W4LevC6+WUWX5uocg3TlUiZ8T/g=";

    let map, marker, html5QrcodeScanner = null, activeTargetInput = null;
    const defaultLat = 2.883793, defaultLng = 99.184753;

    window.addEventListener('load', () => {
        map = L.map('map').setView([defaultLat, defaultLng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

        marker.on('dragend', function () {
            const position = marker.getLatLng();
            updateKoordinatInput(position.lat, position.lng);
        });

        getGPSLocation();
    });

    function updateKoordinatInput(lat, lng) {
        document.getElementById('inpKoordinat').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }

    function getGPSLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                updateKoordinatInput(lat, lng);
                map.setView([lat, lng], 17);
                marker.setLatLng([lat, lng]);
                showToast("Lokasi GPS terdeteksi!");
            }, () => {
                showToast("Gagal mengambil GPS. Silakan tentukan titik di peta.");
            }, { enableHighAccuracy: true });
        } else {
            showToast("Browser tidak mendukung GPS");
        }
    }

    function updateFileLabel(input, labelId) {
        if (input.files && input.files[0]) {
            document.getElementById(labelId).innerText = "✓ " + input.files[0].name.substring(0, 10) + "...";
        }
    }

    // MODUL AUTOMATIS KAMERA SCANNER BARCODE
    function startScanner(inputId) {
        activeTargetInput = inputId;
        document.getElementById('scannerModal').classList.remove('hidden');

        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                document.getElementById(activeTargetInput).value = decodedText.trim().toUpperCase();
                showToast("Barcode Terbaca: " + decodedText);
                stopScanner();
            },
            (errorMessage) => {}
        ).catch(err => {
            showToast("Gagal membuka kamera. Pastikan izin kamera aktif.");
            stopScanner();
        });
    }

    function stopScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner.clear();
                document.getElementById('scannerModal').classList.add('hidden');
            }).catch(() => {
                document.getElementById('scannerModal').classList.add('hidden');
            });
        } else {
            document.getElementById('scannerModal').classList.add('hidden');
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function directUploadToImageKit(fileInput, customFileName, targetFolder) {
        const base64File = await fileToBase64(fileInput);

        const authRes = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getImageKitAuth" })
        }).then(r => r.json());

        if (!authRes.success) {
            throw new Error("Gagal mengambil izin autentikasi ImageKit");
        }

        const formData = new FormData();
        formData.append("file", base64File);
        formData.append("fileName", customFileName);
        formData.append("publicKey", IMAGEKIT_PUBLIC_KEY);
        formData.append("signature", authRes.signature);
        formData.append("expire", authRes.expire);
        formData.append("token", authRes.token);
        if (targetFolder) formData.append("folder", targetFolder);

        const response = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            const errJson = await response.json();
            throw new Error(errJson.message || "Gagal upload gambar");
        }
        const json = await response.json();
        return json.url;
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileRumah = document.getElementById('fileFotoRumah').files[0];
        const fileAlat = document.getElementById('fileFotoAlat').files[0];

        if (!fileRumah || !fileAlat) return showToast("Foto Rumah & Alat Wajib!");

        try {
            btn.innerText = "Mengunggah Gambar...";
            btn.disabled = true;

            const snUnit = document.getElementById('inpSnUnit').value || 'unit';

            const urlRumah = await directUploadToImageKit(fileRumah, `Rumah_${snUnit}_${Date.now()}.jpg`, "/Foto Rumah");
            const urlAlat = await directUploadToImageKit(fileAlat, `Alat_${snUnit}_${Date.now()}.jpg`, "/Foto perangkat");

            btn.innerText = "Menyimpan Data...";

            const koordinat = document.getElementById('inpKoordinat').value;
            const linkMaps = koordinat ? `https://maps.google.com/?q=${koordinat}` : "";

            const payload = {
                action: "simpanData",
                koordinat: koordinat,
                odp: document.getElementById('inpOdp').value,
                pop: document.getElementById('inpPop').value,
                cidLama: document.getElementById('inpCidLama').value,
                namaLama: document.getElementById('inpNamaLama').value,
                snUnit: snUnit,
                pSn: document.getElementById('inpPSn').value,
                keterangan: document.getElementById('inpKeterangan').value,
                urlFotoRumah: urlRumah,
                urlFotoAlat: urlAlat,
                linkMaps: linkMaps
            };

            const res = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(r => r.json());

            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast(res.message);

            if (res.success) {
                document.getElementById('formLapangan').reset();
                document.getElementById('labelFotoRumah').innerText = "FOTO RUMAH *";
                document.getElementById('labelFotoAlat').innerText = "FOTO ALAT *";
            }
        } catch (err) {
            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast("Error: " + err.message);
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.bottom = '20px';
        setTimeout(() => t.style.bottom = '-100px', 3000);
    }
</script>
</body>
</html>

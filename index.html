<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Lapangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; }
        .toast-msg {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 10px 20px; border-radius: 99px;
            transition: all 0.3s ease; z-index: 1000; font-size: 12px; font-weight: 600;
        }
    </style>
</head>
<body class="p-3 sm:p-6 max-w-xl mx-auto min-h-screen flex flex-col justify-between">

    <div class="space-y-4">
        <!-- HEADER APPS -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <h1 class="text-base font-extrabold text-slate-800">SISTEM LAPANGAN</h1>
                <p class="text-[10px] text-gray-400">Formulir Input Data Terintegrasi</p>
            </div>
            <!-- TOMBOL KE DASHBOARD ADMIN -->
            <a href="admin.html" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 border border-indigo-200 transition">
                <i class="fas fa-user-shield"></i> Login Admin
            </a>
        </div>

        <!-- FORM INPUT LAPANGAN -->
        <form id="formLapangan" onsubmit="handleFormSubmit(event)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3 text-xs">
            
            <!-- KOORDINAT GPS -->
            <div>
                <label class="font-bold text-gray-600 uppercase text-[10px]">Koordinat GPS *</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="inpKoordinat" required placeholder="Contoh: 2.883793, 99.184753" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold">
                    <button type="button" onclick="getGPSLocation()" class="bg-slate-800 text-white font-bold px-3 rounded-xl hover:bg-slate-700 whitespace-nowrap">
                        <i class="fas fa-location-arrow"></i> GPS
                    </button>
                </div>
            </div>

            <!-- ODP & POP -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-gray-600 uppercase text-[10px]">ODP *</label>
                    <input type="text" id="inpOdp" required placeholder="Nama ODP" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold mt-1">
                </div>
                <div>
                    <label class="font-bold text-gray-600 uppercase text-[10px]">POP *</label>
                    <input type="text" id="inpPop" required placeholder="Nama POP" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold mt-1">
                </div>
            </div>

            <!-- CID LAMA & NAMA LAMA -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="font-bold text-gray-600 uppercase text-[10px]">CID Lama *</label>
                    <input type="text" id="inpCidLama" required placeholder="Nomor CID" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold mt-1">
                </div>
                <div>
                    <label class="font-bold text-gray-600 uppercase text-[10px]">Nama Lama *</label>
                    <input type="text" id="inpNamaLama" required placeholder="Nama Pelanggan" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold mt-1">
                </div>
            </div>

            <!-- SERIAL NUMBER (SN) UNIT -->
            <div>
                <label class="font-bold text-gray-600 uppercase text-[10px]">Serial Number (SN) Unit *</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="inpSnUnit" required placeholder="SN Unit Baru" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold uppercase">
                    <button type="button" onclick="triggerScan('inpSnUnit')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 rounded-xl whitespace-nowrap">
                        <i class="fas fa-barcode"></i> Scan SN
                    </button>
                </div>
            </div>

            <!-- P-SN (FIELD BARU SAMAA PERTIS SEPERTI SN) -->
            <div>
                <label class="font-bold text-gray-600 uppercase text-[10px]">P-SN (Patchcord SN) *</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="inpPSn" required placeholder="P-SN Unit" class="w-full bg-gray-50 border rounded-xl px-3 py-2 outline-none font-semibold uppercase">
                    <button type="button" onclick="triggerScan('inpPSn')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 rounded-xl whitespace-nowrap">
                        <i class="fas fa-barcode"></i> Scan P-SN
                    </button>
                </div>
            </div>

            <!-- UPLOAD FOTO RUMAH & FOTO ALAT -->
            <div class="grid grid-cols-2 gap-2 pt-2">
                <div>
                    <label class="block text-center bg-gray-50 border-2 border-dashed border-gray-200 hover:border-indigo-500 rounded-2xl p-3 cursor-pointer">
                        <i class="fas fa-camera text-gray-400 text-lg mb-1 block"></i>
                        <span id="labelFotoRumah" class="font-bold text-[10px] text-gray-500">FOTO RUMAH *</span>
                        <input type="file" id="fileFotoRumah" accept="image/*" required class="hidden" onchange="updateFileLabel(this, 'labelFotoRumah')">
                    </label>
                </div>
                <div>
                    <label class="block text-center bg-gray-50 border-2 border-dashed border-gray-200 hover:border-indigo-500 rounded-2xl p-3 cursor-pointer">
                        <i class="fas fa-camera text-gray-400 text-lg mb-1 block"></i>
                        <span id="labelFotoAlat" class="font-bold text-[10px] text-gray-500">FOTO ALAT *</span>
                        <input type="file" id="fileFotoAlat" accept="image/*" required class="hidden" onchange="updateFileLabel(this, 'labelFotoAlat')">
                    </label>
                </div>
            </div>

            <!-- KETERANGAN -->
            <div>
                <label class="font-bold text-gray-600 uppercase text-[10px]">Keterangan Tambahan</label>
                <textarea id="inpKeterangan" rows="2" placeholder="Catatan opsional..." class="w-full bg-gray-50 border rounded-xl p-2.5 outline-none mt-1"></textarea>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="btnSubmit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3 rounded-2xl text-xs transition mt-2">
                Kirim Data Lapangan
            </button>
        </form>
    </div>

    <div id="toast" class="toast-msg">Notifikasi</div>

<script>
    const GAS_WEB_APP_URL = "MASUKKAN_URL_GOOGLE_APPS_SCRIPT_DI_SINI";
    const IMAGEKIT_PUBLIC_KEY = "MASUKKAN_PUBLIC_KEY_IMAGEKIT_DI_SINI";

    function updateFileLabel(input, labelId) {
        if (input.files && input.files[0]) {
            document.getElementById(labelId).innerText = "✓ " + input.files[0].name.substring(0, 10) + "...";
        }
    }

    function getGPSLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('inpKoordinat').value = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                showToast("Lokasi berhasil didapatkan!");
            }, () => showToast("Gagal mengambil lokasi GPS"));
        } else showToast("Browser tidak mendukung GPS");
    }

    function triggerScan(targetFieldId) {
        const val = prompt("Scan Barcode / Masukkan nilai manual:");
        if (val) document.getElementById(targetFieldId).value = val.trim().toUpperCase();
    }

    async function directUploadToImageKit(fileInput, customFileName, targetFolder) {
        const formData = new FormData();
        formData.append("file", fileInput);
        formData.append("fileName", customFileName);
        formData.append("publicKey", IMAGEKIT_PUBLIC_KEY);
        if (targetFolder) formData.append("folder", targetFolder);

        const response = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            const errJson = await response.json();
            throw new Error(errJson.message || "Gagal upload gambar");
        }
        const json = await response.json();
        return json.url;
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileRumah = document.getElementById('fileFotoRumah').files[0];
        const fileAlat = document.getElementById('fileFotoAlat').files[0];

        if (!fileRumah || !fileAlat) return showToast("Foto Rumah & Alat Wajib!");

        try {
            btn.innerText = "Mengunggah Gambar...";
            btn.disabled = true;

            const snUnit = document.getElementById('inpSnUnit').value || 'unit';

            // Upload ke folder ImageKit masing-masing
            const urlRumah = await directUploadToImageKit(fileRumah, `Rumah_${snUnit}_${Date.now()}.jpg`, "/Foto Rumah");
            const urlAlat = await directUploadToImageKit(fileAlat, `Alat_${snUnit}_${Date.now()}.jpg`, "/Foto perangkat");

            btn.innerText = "Menyimpan Data...";

            const koordinat = document.getElementById('inpKoordinat').value;
            const linkMaps = koordinat ? `https://maps.google.com/?q=${koordinat}` : "";

            const payload = {
                action: "simpanData",
                koordinat: koordinat,
                odp: document.getElementById('inpOdp').value,
                pop: document.getElementById('inpPop').value,
                cidLama: document.getElementById('inpCidLama').value,
                namaLama: document.getElementById('inpNamaLama').value,
                snUnit: snUnit,
                pSn: document.getElementById('inpPSn').value,
                keterangan: document.getElementById('inpKeterangan').value,
                urlFotoRumah: urlRumah,
                urlFotoAlat: urlAlat,
                linkMaps: linkMaps
            };

            const res = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(r => r.json());

            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast(res.message);

            if (res.success) {
                document.getElementById('formLapangan').reset();
                document.getElementById('labelFotoRumah').innerText = "FOTO RUMAH *";
                document.getElementById('labelFotoAlat').innerText = "FOTO ALAT *";
            }
        } catch (err) {
            btn.innerText = "Kirim Data Lapangan";
            btn.disabled = false;
            showToast("Error: " + err.message);
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.bottom = '20px';
        setTimeout(() => t.style.bottom = '-100px', 3000);
    }
</script>
</body>
</html>

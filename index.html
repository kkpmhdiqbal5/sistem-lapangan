<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Lapangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> #map { height: 220px; width: 100%; border-radius: 8px; } </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="font-bold text-gray-800 text-lg">Sistem Lapangan</div>
    <a href="admin.html" class="bg-slate-800 text-white hover:bg-slate-900 px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition">
      <i class="fa-solid fa-user-lock"></i> Dashboard Admin
    </a>
  </nav>

  <div class="max-w-4xl mx-auto my-6 px-4">
    <div class="bg-sky-600 text-white p-4 rounded-t-xl text-center text-sm font-medium shadow">
      Dashboard Utama: Peta Satelit Google Hybrid Otomatis Melacak Posisi Lapangan Anda.
    </div>

    <div class="bg-white p-6 rounded-b-xl shadow-md border border-t-0 space-y-4">
      <div id="map"></div>

      <form id="form-lapangan" onsubmit="submitForm(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Koordinat Terdeteksi Otomatis</label>
          <input type="text" id="koordinat" readonly required placeholder="Mendapatkan lokasi..." class="w-full bg-gray-50 border border-gray-300 p-2.5 rounded-md text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">ODP TERDAFTAR / BARU *</label>
          <input type="text" id="odp" required placeholder="Pilih ODP atau ketik baru" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">POP *</label>
          <input type="text" id="pop" required placeholder="Masukkan data nama POP" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">CID LAMA *</label>
            <input type="text" id="cid_lama" required placeholder="Ex: CID10" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">NAMA LAMA *</label>
            <input type="text" id="nama_lama" required placeholder="Ex: Budiman" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">FOTO RUMAH *</label>
            <input type="file" id="foto_rumah" accept="image/*" required class="w-full border border-gray-300 p-2 rounded-md text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">FOTO ALAT *</label>
            <input type="file" id="foto_alat" accept="image/*" required class="w-full border border-gray-300 p-2 rounded-md text-sm bg-gray-50">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">SERIAL NUMBER (SN) UNIT *</label>
            <input type="text" id="sn" required placeholder="Ketik atau Scan SN" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">P-SN (PORT SERIAL NUMBER) *</label>
            <input type="text" id="psn" required placeholder="Ketik atau Scan P-SN" class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">KETERANGAN (OPSIONAL)</label>
          <textarea id="keterangan" rows="3" placeholder="Catatan kendala lapangan jika ada..." class="w-full border border-gray-300 p-2.5 rounded-md text-sm outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-md hover:bg-slate-800 transition">
          Kirim Data Lapangan
        </button>
      </form>
    </div>
  </div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";
  const BOT_TOKEN_RUMAH = "8782461297:AAF86N2WvKmbbhbQEnQ7rzfaHmPhxmVf5Xg";
  const BOT_TOKEN_ALAT = "8903234783:AAEw2CyDfh_hNyVTEUxgF-h0XTiNvL01u14";
  
  // Chat ID dari Telegram Anda
  const TELEGRAM_CHAT_ID = "8475745358"; 

  let map;
  window.onload = function() {
    map = L.map('map').setView([2.883793, 99.184753], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        document.getElementById('koordinat').value = `${lat}, ${lng}`;
        map.setView([lat, lng], 16);
        L.marker([lat, lng]).addTo(map).bindPopup("Lokasi Anda").openPopup();
      }, () => {
        document.getElementById('koordinat').value = "2.883793, 99.184753";
      });
    }
  };

  // Fungsi Upload Foto ke Telegram Bot
  async function uploadToTelegram(fileInputId, botToken) {
    const fileInput = document.getElementById(fileInputId);
    if (!fileInput || !fileInput.files[0]) return "";

    const formData = new FormData();
    formData.append("chat_id", TELEGRAM_CHAT_ID);
    formData.append("photo", fileInput.files[0]);

    try {
      const res = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { 
        method: 'POST', 
        body: formData 
      });
      const data = await res.json();
      if (data.ok) {
        const fileId = data.result.photo[data.result.photo.length - 1].file_id;
        const pathRes = await fetch(`https://api.telegram.org/bot${botToken}/getFile?file_id=${fileId}`);
        const pathData = await pathRes.json();
        if (pathData.ok) {
          return `https://api.telegram.org/file/bot${botToken}/${pathData.result.file_path}`;
        }
      } else {
        console.error("Telegram API Error:", data.description);
        alert("Gagal kirim foto ke Telegram: " + data.description);
      }
    } catch (e) {
      console.error("Upload Telegram Error:", e);
    }
    return "";
  }

  async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.innerText = "Mengirim Data & Mengunggah Foto...";
    btn.disabled = true;

    // Upload Foto
    const urlFotoRumah = await uploadToTelegram('foto_rumah', BOT_TOKEN_RUMAH);
    const urlFotoAlat = await uploadToTelegram('foto_alat', BOT_TOKEN_ALAT);

    const koordinat = document.getElementById('koordinat').value;
    const linkMaps = `https://www.google.com/maps?q=${koordinat.replace(/\s+/g, '')}`;

    const payload = {
      action: 'submit',
      koordinat: koordinat,
      odp: document.getElementById('odp').value,
      pop: document.getElementById('pop').value,
      cid_lama: document.getElementById('cid_lama').value,
      nama_lama: document.getElementById('nama_lama').value,
      sn: document.getElementById('sn').value,
      keterangan: document.getElementById('keterangan').value,
      foto_rumah: urlFotoRumah,
      foto_alat: urlFotoAlat,
      link_maps: linkMaps,
      psn: document.getElementById('psn').value
    };

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("Data Lapangan Berhasil Disimpan!");
      document.getElementById('form-lapangan').reset();
    } catch (err) {
      alert("Gagal menyimpan data.");
      console.error(err);
    } finally {
      btn.innerText = "Kirim Data Lapangan";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>

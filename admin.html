<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Sistem Cari</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR ATAS -->
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="font-bold text-gray-800 text-base flex items-center gap-2">
      Dashboard Admin
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-white border text-gray-700 hover:bg-gray-50 px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-satellite-dish"></i> Sistem Lapangan
      </a>
      <a href="search.html" class="bg-emerald-600 text-white hover:bg-emerald-700 px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-search"></i> Sistem Cari
      </a>
      <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded text-xs font-medium flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <!-- KONTROL DASHBOARD -->
  <div class="max-w-7xl mx-auto my-8 px-4 space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800">Ringkasan Data Sistem</h1>
      <button onclick="fetchDashboardStats()" class="text-xs bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded shadow-sm font-medium flex items-center gap-1.5">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- KARTU 1: PERANGKAT BELUM DIAMBIL (Full Data + Target Kolom I Terisi) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-amber-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Perangkat Belum Diambil</p>
          <h2 id="count-belum" class="text-3xl font-extrabold text-gray-800 mt-1"><i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i></h2>
          <p class="text-[11px] text-gray-500 mt-1">Sumber: Sheet "Full Data" + "target" (Kolom I terisi)</p>
        </div>
        <div class="bg-amber-100 text-amber-600 w-12 h-12 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-box-archive"></i>
        </div>
      </div>

      <!-- KARTU 2: PERANGKAT SUDAH DIAMBIL -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Perangkat Sudah Diambil</p>
          <h2 id="count-sudah" class="text-3xl font-extrabold text-gray-800 mt-1"><i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i></h2>
          <p class="text-[11px] text-gray-500 mt-1">Sumber: Sheet "sudah diambil"</p>
        </div>
        <div class="bg-emerald-100 text-emerald-600 w-12 h-12 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-box-open"></i>
        </div>
      </div>

      <!-- KARTU 3: INFO PERANGKAT LAPANGAN -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total Info Perangkat Lapangan</p>
          <h2 id="count-info" class="text-3xl font-extrabold text-gray-800 mt-1"><i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i></h2>
          <p class="text-[11px] text-gray-500 mt-1">Sumber: Sheet "Baris 1"</p>
        </div>
        <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-clipboard-list"></i>
        </div>
      </div>

    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";

    if (localStorage.getItem("admin_logged_in") !== "true") {
      window.location.href = "login.html";
    }

    async function fetchDashboardStats() {
      // Tampilkan indikator loading ringan
      document.getElementById('count-belum').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i>`;
      document.getElementById('count-sudah').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i>`;
      document.getElementById('count-info').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-gray-300 text-2xl"></i>`;

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllData`);
        if (!res.ok) throw new Error("Koneksi gagal");
        
        const data = await res.json();

        // --- OPTIMASI 1: Hitung Full Data secara efisien ---
        let countFullData = 0;
        if (data["Full Data"] && Array.isArray(data["Full Data"])) {
          const len = data["Full Data"].length;
          countFullData = len > 1 ? len - 1 : 0; // Langsung kurangi header tanpa looping berat
        }

        // --- OPTIMASI 2: Hitung target (Hanya Kolom I terisi) ---
        let countTargetValid = 0;
        if (data["target"] && Array.isArray(data["target"])) {
          const targetRows = data["target"];
          const len = targetRows.length;
          // Gunakan for loop biasa (paling cepat di JS)
          for (let i = 1; i < len; i++) {
            const r = targetRows[i];
            if (r && r.length > 8 && r[8] !== undefined && r[8] !== null && String(r[8]).trim() !== "") {
              countTargetValid++;
            }
          }
        }

        // Render Angka Kartu 1
        document.getElementById('count-belum').innerText = countFullData + countTargetValid;

        // --- OPTIMASI 3: Hitung "sudah diambil" ---
        let countSudah = 0;
        if (data["sudah diambil"] && Array.isArray(data["sudah diambil"])) {
          countSudah = data["sudah diambil"].length;
        }
        document.getElementById('count-sudah').innerText = countSudah;

        // --- OPTIMASI 4: Hitung "Baris 1" ---
        let countInfo = 0;
        if (data["Baris 1"] && Array.isArray(data["Baris 1"])) {
          const len = data["Baris 1"].length;
          countInfo = len > 1 ? len - 1 : 0;
        }
        document.getElementById('count-info').innerText = countInfo;

      } catch (err) {
        console.error("Gagal memuat statistik dashboard:", err);
        document.getElementById('count-belum').innerText = "0";
        document.getElementById('count-sudah').innerText = "0";
        document.getElementById('count-info').innerText = "0";
      }
    }

    function logout() {
      localStorage.removeItem("admin_logged_in");
      window.location.href = "login.html";
    }

    // Jalankan penghitungan cepat saat halaman dibuka
    window.onload = fetchDashboardStats;
  </script>
</body>
</html>

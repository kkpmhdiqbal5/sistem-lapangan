<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <!-- NAVBAR -->
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center">
    <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
      <i class="fa-solid fa-gauge text-indigo-600"></i> Dashboard Admin
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-sky-600 text-white hover:bg-sky-700 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-satellite-dish"></i> Sistem Lapangan
      </a>
      <a href="search.html" class="bg-emerald-600 text-white hover:bg-emerald-700 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-magnifying-glass"></i> Sistem Cari
      </a>
      <button onclick="logout()" class="bg-rose-600 text-white hover:bg-rose-700 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-1.5 transition">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto my-8 px-4 space-y-6">
    
    <!-- KARTU STATISTIK (3 KOTAK) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Box 1: Perangkat Belum Diambil -->
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-amber-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Perangkat Belum Diambil</p>
          <h2 id="count-belum" class="text-3xl font-extrabold text-gray-800 mt-1">...</h2>
          <span class="text-xs text-gray-400">Sumber: Sheet "Full Data"</span>
        </div>
        <div class="bg-amber-100 p-4 rounded-full text-amber-600 text-2xl">
          <i class="fa-solid fa-box-open"></i>
        </div>
      </div>

      <!-- Box 2: Perangkat Sudah Diambil -->
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-emerald-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Perangkat Sudah Diambil</p>
          <h2 id="count-sudah" class="text-3xl font-extrabold text-gray-800 mt-1">...</h2>
          <span class="text-xs text-gray-400">Sumber: Sheet "sudah diambil"</span>
        </div>
        <div class="bg-emerald-100 p-4 rounded-full text-emerald-600 text-2xl">
          <i class="fa-solid fa-box-archive"></i>
        </div>
      </div>

      <!-- Box 3: Info Perangkat / Input Lapangan -->
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-sky-500 flex justify-between items-center">
        <div>
          <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total Info Perangkat Lapangan</p>
          <h2 id="count-info" class="text-3xl font-extrabold text-gray-800 mt-1">...</h2>
          <span class="text-xs text-gray-400">Sumber: Sheet "Baris 1"</span>
        </div>
        <div class="bg-sky-100 p-4 rounded-full text-sky-600 text-2xl">
          <i class="fa-solid fa-clipboard-list"></i>
        </div>
      </div>

    </div>

  </div>

  <script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHOXnA4YsBeNdPDUxXwPlsJHPJo7k7E4IqItpNOKLjfsYeQce7a9Gda8p-3p-Ys6tJkg/exec";

  // Cek Sesi Login Admin
  if (localStorage.getItem("admin_logged_in") !== "true") {
    window.location.href = "login.html";
  }

  async function loadDashboardStats() {
    try {
      const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDashboard`);
      const data = await res.json();
      
      document.getElementById('count-belum').innerText = data.countBelum ?? 0;
      document.getElementById('count-sudah').innerText = data.countSudah ?? 0;
      
      // Menangkap variabel jumlah data info perangkat
      document.getElementById('count-info').innerText = data.countInfoPerangkat ?? data.countInfo ?? 0;
    } catch (err) {
      console.error(err);
    }
  }

  function logout() {
    localStorage.removeItem("admin_logged_in");
    window.location.href = "login.html";
  }

  window.onload = loadDashboardStats;
</script>
</body>
</html>
